template_id: "bit_career_guidance_v1"
template_name: "BIT Career Guidance Feedback Form"

# Canvas dimensions used as baseline resolution reference
canvas:
  width: 2479
  height: 3508
  dpi: 300

# Registration corner markers (top-left, top-right, bottom-right, bottom-left)
# Normalized bounding coordinates [x_min, y_min, x_max, y_max] in [0, 1] range
registration_markers:
  top_left: [0.040, 0.028, 0.072, 0.051]
  top_right: [0.927, 0.028, 0.960, 0.051]
  bottom_right: [0.927, 0.948, 0.960, 0.971]
  bottom_left: [0.040, 0.948, 0.072, 0.971]

