questionnaire:
  type: "checkbox_group"
  questions:
    - question_id: "q1"
      label: "Are you interested in joining BIT for B.E/B.Tech courses?"
      options:
        - label: "Yes"
          center_normalized: [0.443, 0.426]
          radius_normalized: 0.011
        - label: "No"
          center_normalized: [0.564, 0.426]
          radius_normalized: 0.011

    - question_id: "q2"
      label: "Rate the usefulness of Career Guidance Programme"
      options:
        - label: "Excellent"
          center_normalized: [0.443, 0.451]
          radius_normalized: 0.011
        - label: "Good"
          center_normalized: [0.564, 0.451]
          radius_normalized: 0.011
        - label: "Satisfactory"
