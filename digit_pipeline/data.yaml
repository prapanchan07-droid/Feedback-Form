# data.yaml – YOLOv8 dataset configuration
# Generated by the digit_pipeline project.
# Place this file inside digit_pipeline/ (same folder as make_data.py).

path: data          # root dataset directory (relative to this yaml file)
train: images/train
val:   images/val

nc: 1               # number of classes
names:
  - box             # the single class: a handwritten-digit input box

# ── Training command (run from inside digit_pipeline/):
#
#   yolo train \
#       model=yolov8s.pt \
#       data=data.yaml \
#       imgsz=1280 \
#       epochs=100 \
#       batch=8 \
#       project=runs/box_detector \
#       name=v1 \
#       cache=ram
#
# ── Fine-tuning on real scans (see README for full instructions):
#
#   yolo train \
#       model=runs/box_detector/v1/weights/best.pt \
#       data=data_real.yaml \
#       imgsz=1280 \
#       epochs=30 \
#       batch=4 \
#       freeze=10
